# Local observability stack: ShortTok + Prometheus + Grafana.
#   ANTHROPIC_API_KEY=... docker compose up -d --build
#   Grafana: http://localhost:3000 (dashboard "ShortTok"), Prometheus: http://localhost:9090
services:
  shorttok:
    build: .
    ports: ["8080:8080"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SHORTTOK_PRICING_FILE: /etc/shorttok/pricing.json
      SHORTTOK_HISTORY_MIN_TOKENS: ${SHORTTOK_HISTORY_MIN_TOKENS:-2000}
    volumes:
      - ./deploy/pricing.json:/etc/shorttok/pricing.json:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shorttok.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
